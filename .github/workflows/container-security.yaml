name: Container Security

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # --------------------------------------------------
  # 1. Application dependency/security scan
  # --------------------------------------------------
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: |
          npm audit --audit-level=high


  # --------------------------------------------------
  # 2. Build Docker image
  # --------------------------------------------------
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - dependency-scan

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t container-security:${{ github.sha }} \
            .


  # --------------------------------------------------
  # 3. Container security scanning
  # --------------------------------------------------
  container-security:
    name: Trivy Container Security Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t container-security:${{ github.sha }} \
            .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-security:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-security:${{ github.sha }}
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1